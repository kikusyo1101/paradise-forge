name: Tribunal — 執行官の審査

# The paradise's separation of powers, enforced in CI.
# This workflow is the MACHINE gate: it proves the facts (tests, policy, secrets)
# that the tribunal and God then judge. It answers to no branch and cannot be
# talked out of a failure (Constitution Art. 5: evidence, not claims).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    name: 検証ゲート (self-test / policy / secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ⚖️ Self-test — 楽園の自己検証
        # **この段は畳まれない。畳みの根拠を作る段である**(NFR-02 / AC-23)。
        # 第56条(d):「緑の根拠になるのは引数無しの全走だけである」。
        # 1 回の CI に**素の全走が少なくとも一本**在ることを AC-23 の門が数える。
        #
        # ⚠️ **この段に `--no-fold` を書かない。** 書けば `bail=disabled` を名乗り、
        #    「畳まなかった」のか「畳む機構が壊れていた」のかが出力から区別できなくなる。
        #    台帳が空なので `bail=no-receipt` を名乗って全走する —— それが正しい名乗りである(AC-08)。
        env:
          PARADISE_FOLD_LEDGER: ${{ runner.temp }}/paradise-fold-ledger.jsonl
          # **台帳は checkout の外に住む**(security S-2 / BLOCK)。
          # `github.workspace` に置けば PR が `git add -f` で台帳そのものを持ち込め、
          # `.gitignore` は checkout を縛らない —— **データ 1 本で 4 段が偽の緑になる**。
          # 正しい形は畳みを見張る段が既に持っていた。四段をそれに揃える。
          # **一走行に閉じる**(security S-1 / requirements §7-6)。領収書の `run` 欄が
          # 走行を跨いだ再利用を拒む。**同じ job の段はすべて同じ値を名乗る** ——
          # でなければ畳みが一切効かない。`run_attempt` を含めるのは再実行が別の走行だからである。
          PARADISE_FOLD_RUN: gh-${{ github.run_id }}-${{ github.run_attempt }}
        run: node tests/paradise.test.js

      - name: 🏛️ Workspace — 創造物が楽園に紛れていないか (第30条)
        run: node graph/workspace.js check

      - name: 🔁 Conclave audit — 見捨てられた走行が居ないか (第53条)
        # 環は閉じるまで走行である。マージは環の完了ではない ——
        # 走行帳が未完のまま無音なら exit 1 で鳴る。判定不能もまた緑ではない(第16条)。
        # `|| true` を付けない: 潰した門は門の形をした飾りである。
        run: node graph/conclave.js audit

      - name: 📜 Constitution — 憲法条文の存在確認
        run: |
          test -f CONSTITUTION.md || { echo "::error::CONSTITUTION.md is missing"; exit 1; }
          count=$(grep -cE '^[0-9]+\. \*\*' CONSTITUTION.md)
          echo "constitution articles: $count"
          test "$count" -ge 12 || { echo "::error::expected >= 12 articles, found $count"; exit 1; }

      - name: 🎖️ Model policy — 位階別モデル方針の整合
        run: |
          node graph/clergy.js models
          # verify runs against ~/.claude/agents which does not exist in CI;
          # instead assert the policy itself resolves correctly.
          node -e "
            const c = require('./graph/clergy.js');
            // 能力は序列で検める。モデル名を直書きすると、神が方針を変えた瞬間に
            // 門が偽の赤を出す — 守るべきは名前ではなく『判断は安く上げない』という順序。
            const TIER = { haiku:1, 'claude-haiku-4-5':1, sonnet:2, 'claude-sonnet-5':2,
                           opus:3, 'claude-opus-5':3, 'claude-opus-5-5':3, fable:4, 'claude-fable-5':4 };
            const t = m => { if (!TIER[m]) { console.error('::error::unknown model tier: ' + m); process.exit(1); } return TIER[m]; };
            const priest = t(c.RANKS.priest.model);
            for (const rank of ['pontiff','cardinal','executor']) {
              if (t(c.RANKS[rank].model) < priest) {
                console.error('::error::rank ' + rank + ' must never be cheaper than a priest');
                process.exit(1);
              }
            }
            if (t(c.RANKS.believer.model) > priest) {
              console.error('::error::a believer above a priest inverts the hierarchy');
              process.exit(1);
            }
            for (const n of ['self-critic','creation-judge','security-reviewer','planner','ux-reviewer']) {
              if (t(c.modelFor(n, 'priest').model) < 3) {
                console.error('::error::' + n + ' must never be cheapened');
                process.exit(1);
              }
            }
            // 効かない effort は宣言ではない (第31条)
            for (const [name, r] of Object.entries(c.RANKS)) {
              if (r.model && !c.supportsEffort(r.model, r.effort)) {
                console.error('::error::rank ' + name + ': ' + r.model + ' does not accept effort:' + r.effort);
                process.exit(1);
              }
            }
            console.log('model policy intact — judgment is not cheapened');
          "

      - name: 👑 Pontiff seat — 教主の座が機構化されているか (第31条)
        run: |
          node graph/apply-seat.js plan
          node -e "
            const s = require('./graph/apply-seat.js');
            const c = require('./graph/clergy.js');
            // 無人(-p)では課金同意が出ない。無人の座に Fable を置いてはならない。
            if (/fable/i.test(s.UNATTENDED_SEAT.model)) {
              console.error('::error::the unattended seat must never be Fable — non-interactive runs bill without asking');
              process.exit(1);
            }
            if (/fable/i.test(c.RANKS.pontiff.model) && s.UNATTENDED_SEAT.model === c.RANKS.pontiff.model) {
              console.error('::error::the unattended seat must differ from the pontiff seat');
              process.exit(1);
            }
            console.log('pontiff seat is a mechanism; the unattended seat is pinned to ' + s.UNATTENDED_SEAT.model);
          "

      - name: 🔒 Secret scan — 秘密情報の混入検査
        run: |
          if grep -rIn -E "sk-[a-zA-Z0-9]{20,}|gh[pou]_[a-zA-Z0-9]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----" \
               --exclude-dir=.git --exclude-dir=node_modules . ; then
            echo "::error::potential secret detected — BLOCK (Constitution Art. 5)"
            exit 1
          fi
          echo "no secrets detected"

      - name: 🧩 Engine integrity — 全エンジンが読み込めるか
        run: |
          # 手書きの一覧は新しい engine を黙って取りこぼす（実際 census/daily-guard が
          # 漏れていた）。ディスクを走査し、graph/*.js を一つ残らず読み込む。
          fail=0
          for f in graph/*.js; do
            node -e "require('./$f')" || { echo "::error::$f failed to load"; fail=1; }
            echo "  ok $f"
          done
          test "$fail" -eq 0

      - name: 🔢 Census — 楽園が己について語る数が真実か (第22条)
        # 実測(findings §1.1 / M-3): この段の 423s のほぼ全部が
        # `census.js:123` が起こす自己診断の子プロセスである(census 自身の仕事は 3ms)。
        # Self-test 段(:27)と**同一入力**であることを鍵が保証するので、領収書を読む。
        # ⚠️ **`--no-tests` を使ってはならない**(AC-04)。M-5 が実証した罠である:
        #    exit 0 / findings 0 を出すが「README テスト数」の主張が measurable=false に落ち、
        #    第22条の旗艦の数が**黙って無検査になる**(第37条違反)。
        #    畳みは「撃たない」であって「裁かない」ではない。
        env:
          PARADISE_FOLD_LEDGER: ${{ runner.temp }}/paradise-fold-ledger.jsonl
          # **台帳は checkout の外に住む**(security S-2 / BLOCK)。
          # `github.workspace` に置けば PR が `git add -f` で台帳そのものを持ち込め、
          # `.gitignore` は checkout を縛らない —— **データ 1 本で 4 段が偽の緑になる**。
          # 正しい形は畳みを見張る段が既に持っていた。四段をそれに揃える。
          # **一走行に閉じる**(security S-1 / requirements §7-6)。領収書の `run` 欄が
          # 走行を跨いだ再利用を拒む。**同じ job の段はすべて同じ値を名乗る** ——
          # でなければ畳みが一切効かない。`run_attempt` を含めるのは再実行が別の走行だからである。
          PARADISE_FOLD_RUN: gh-${{ github.run_id }}-${{ github.run_attempt }}
        run: node graph/census.js check

      - name: 📒 Fold — 畳みの機構が己の掟を守るか (FR-11 / 第56条 b)
        # ⚠️ **この行を消すと直下の Wiring 門が孤児として名指しで鳴る。**
        #    実測(design D-4): CI の段を消した複製で
        #    `🔴 孤児の門 1: tests/fold.test.js — 建てられているが、CI も paradise.test.js も走らせない`
        #    第44条(b):「建てられた門が、誰にも呼ばれていなかった」が楽園の既往症である。
        #
        # **この段は畳まない。** 畳みを見張る門が畳まれれば、第56条(b) の
        # 「門番は絞り込みの外に立つ」と同じ穴が畳みの側に開く。
        #
        # **台帳は作り物である**(`runner.temp`)。この門は台帳を**壊して鳴らす**
        # (AC-16 の `ledger-unreadable`、AC-25 の並行追記)—— 現物を壊せば、
        # 後続の段が畳めなくなるどころか偽の赤を出す(第58条(c) / 第62条 b)。
        env:
          PARADISE_NO_FOLD: '1'
          PARADISE_FOLD_LEDGER: ${{ runner.temp }}/fold-gate-ledger.jsonl
        run: node tests/fold.test.js

      - name: 🔒 Hermetic — 門が己の測る対象を汚していないか (第58条(c))
        run: node graph/hermetic.js check

      - name: 📄 Derived — 生成物の中身を前提にした検査がないか (第29条)
        run: node graph/derived.js check

      - name: ⛪ Agent presence — 神官の実在 / 無主の相 / 階層の実体 (第21・23・25条)
        run: node graph/check-agents.js

      - name: 🕮 Lexicon — 位階と枢機卿団の名が正典に従うか (第41条)
        run: node graph/clergy.js lexicon-check

      - name: 🗺 Atlas — 楽園が己の姿を図にできるか (第47条)
        # 6つの主題 × 6つの道。IR が作れることと描画器が受理することは別である。
        #
        # **道ごとの `for` ループを畳んだ**(reform/gate-fold / AC-11)。
        # 旧: `for s in …; do node graph/atlas.js check --scale "$s"; done` —— 6 プロセス。
        # 実測(design D-7): **道の中には畳める対が 1 つも無い**。
        #   quick/standard/full/reform/counsel/cartography のいずれも 相異なる HTML = 6。
        # 畳める 20 組は**すべて道を跨ぐ**(hierarchy/dispatch/run/wiring は全道でバイト同一)。
        # ゆえに 6 道を**一つの走行**で見なければ、一回も畳めない。
        #
        # ⚠️ **検査の総数 72 は 1 つも減らない。** 減るのは「同じ成果物を二度検める」分だけである
        #    (揟8 / 第37条)。畳んだ件は `(reused: html=<sha16>)` で写し元を名指す(AC-12)。
        env:
          PARADISE_FOLD_LEDGER: ${{ runner.temp }}/paradise-fold-ledger.jsonl
          # **台帳は checkout の外に住む**(security S-2 / BLOCK)。
          # `github.workspace` に置けば PR が `git add -f` で台帳そのものを持ち込め、
          # `.gitignore` は checkout を縛らない —— **データ 1 本で 4 段が偽の緑になる**。
          # 正しい形は畳みを見張る段が既に持っていた。四段をそれに揃える。
          # **一走行に閉じる**(security S-1 / requirements §7-6)。領収書の `run` 欄が
          # 走行を跨いだ再利用を拒む。**同じ job の段はすべて同じ値を名乗る** ——
          # でなければ畳みが一切効かない。`run_attempt` を含めるのは再実行が別の走行だからである。
          PARADISE_FOLD_RUN: gh-${{ github.run_id }}-${{ github.run_attempt }}
        run: node graph/atlas.js check --all-scales

      - name: 🔗 Wiring — 機構の結線に孤児と宙吊りが無いか (第44条 / 第48条)
        # engine の一覧は写経しない。ディスクを走査し、内の辺(require)と
        # 外の辺(門・命令・神官・掟・試験・器物・散文・機構)を実測する。
        #
        # **この門は自分自身にも掛かる。** 同じ命令が「建てられた門が誰にも
        # 呼ばれていないか」も数える —— 下に足した 3 本が、いつか誰かの手で
        # 黙って外された日に、この門が名指しで赤くする(改革『孤児の門』)。
        run: node graph/wiring.js check

      # ── 孤児だった門 (改革『孤児の門』/ 第44条) ──
      # 三本とも建てられた日から一度も CI に撃たれていなかった。
      # counsel.test.js に至っては **49 passed / 2 failed のまま**、赤いことを
      # 誰も知らずに住み続けていた。門は走らされて初めて門である。
      #
      # ⚠️ ここから行を消すと、直上の Wiring 門が孤児として名指しで鳴る。
      #    手で結線した 3 本を、手で外せる状態にしておかないための自己適用である。

      - name: ⚖️ Guards — 修復が掟を広げていないか (第57条)
        # 第57条が「これを強制する門」として名指しした試験がこれである。
        # 憲法が名指しした門が、CI から一度も撃たれていなかった。
        run: node tests/guards.test.js

      - name: 🏛️ Counsel — 諐問の道と階層の実体 (第25条 / 第32条 / 第37条)
        run: node tests/counsel.test.js

      - name: 🧭 Route matrix — 6 道 × 6 道の混同行列 (第61条)
        # **列ではなく行列で撃つ。** 本走行は道選びを 8 度直し、8 度とも
        # 「別の行き先を奪う」形の回帰を生んだ。うち 7 度は reform の列を撃って
        # 捕らえたが、8 度目 (R-1) は counsel の側だったので誰も見なかった ——
        # 格子実測で counsel → standard/reform が **0/150 → 120/150**。
        # 対角の合計と**非対角の各セルが 0** を両方 assert する。
        run: node tests/route-matrix.test.js

      - name: 💳 Route debt — 未払いの誤着が黙って直っていないか (AC-7 / 第16条)
        # **これは xfail の門である。** PARA-10/PARA-11 は reform/judgment-triad では
        # 直さないと裁定され、**reform/weak-signs が払った**(debt.md §2)。
        # `DEBT` は今 0 件で、D-1/D-3 は **skip を名乗って**通る(第58条(e))——
        # **門は次の残債の受け皿として残す**(第44条の結線)。黙って外せば緩めたことに
        # なるので、誤った振る舞いを凍らせる形は保つ。誰かが直した日に
        # この門が赤くなり、「debt.md から外して本コーパスへ昇格させよ」と教える。
        run: node tests/route-debt.test.js

      - name: 🚪 Reform sign — 弱い印が語中に埋没していないか (PARA-10 / 第60条)
        # **語境界の門である。** `REFORM_RE` の抽象名は一語も減らしていない(counsel.test.js:652)。
        # 直したのは**当たり方**である —— 日本語は `REFORM_FALSE_FRIENDS`(「門」の複合語 21 語)、
        # 英語は `REFORM_EN` の `\b` が語境界を担う(第60条(b): 規則を足したら両枝を持て)。
        #
        # ⚠️ S-3 は**紛れ語表そのものを撃つ門番**である。表に「門」を含まない語を
        #    一語でも足せば鳴る。塞げない同音異義を表で暗記して緑にする道を機械で塞いでいる。
        run: node tests/reform-sign.test.js

      - name: 🎯 Reform reach — 弱い印の射程が黙って変わっていないか (PARA-10 / 第16条)
        # **これは xfail の門である。** 種H(独立語として当たる同音異義)32 件は
        # 語境界の修理では原理的に塞げない(reform/weak-signs/reach.md)。
        # 黙って外せば緩めたことになるので、**誤着を誤着のまま凍らせる**。
        # 誰かが射程を詰めた日にこの門が赤くなり、「reach.md から外して
        # 本コーパスへ昇格させよ」と教える。**`|| true` を付けるな。**
        run: node tests/reform-reach.test.js

      - name: ⚖️ Ratify guard — 仕事をせずに祝福できないか (PARA-6 / 第37条)
        # 旧実装は 17 相すべて pending・成果物 0 件のまま `domains ratified: 6/6` を
        # 成立させ、`conclave.js audit` はそれを `closed` として ✓ で通していた。
        # **数える対象そのものが偽造可能だった。** 四つの枝(reject / rework /
        # blocked の相 / blocked の領域)を対で撃つ —— 片枝だけなら
        # 「常に拒む」実装でも緑になる(第21条 壊して鳴らす)。
        run: node tests/ratify-guard.test.js

      - name: 📤 Lesson export — 刻んだ教訓が門に届いているか (第61条 / 盲点②)
        # `kg.js remember lesson` は KG(.gitignore 済)に刻む。critic が読むのは
        # `lessons.js export` が**生成する** graph/lessons.json である。
        # 本走行は一度も export を走らせず、**自分が刻んだ教訓 10 件が
        # critic に一度も読まれていなかった**(85 件のまま腐っていた)。
        # 刻んだのに門へ届いていない状態は、刻んでいないのと同じである。
        run: node tests/lesson-export.test.js

      - name: 🔁 Abandoned run — 見捨てられた走行を機構が名指すか (第53条)
        run: node tests/abandoned-run.test.js

      - name: 📒 Gauge ledger — 台帳の監査が働くか (第55条 / 第37条)
        # **二段で撃つ。** 実台帳は兄弟倉に住み、CI に兄弟倉は無い。
        # 「台帳が無いので緑」と黙って通すのは第37条(不在は通過ではない)違反である。
        #
        #   (a) 門自体の健全性 — 毒を仕込んだ仮倉の台帳で、exit 1 / 2 が
        #       本当に出ることを撃つ。これが無ければ CI では永遠に skip しか
        #       出ず、門が審であることすら証されない。
        #   (b) 実台帳 — 在る環境(神の機)では監査し、無ければ skip を**名乗って**
        #       通す(第58条(e) の作法。黙って return しない)。
        run: node tests/gauge-audit.test.js

      - name: 🏠 Abode — 住処の器と輸出の台帳 (第58条)
        run: |
          node tests/abode.test.js
          node graph/abode.js check --ledger

      # ── 撤収の跡 (第7段 / AC-30 / 裁可 1-A・2-A) ──
      # 実機の hooks が楽園リポジトリの絶対パスを握っていないか。
      # 第7段で撤収が完遂し 6 件 → 0 件になったので、この門は `--all` に編入された。
      # CI には実機の `~/.claude/settings.json` が無い。ゆえにここは
      # **`· skip: 実機の … が無い — 逆向き依存は検められない` を名乗って exit 0**
      # になるのが正しい(第58条(e))。**黙った緑ではない。**
      # 実測(偽の空ホームを指す env で撃った): skip を名乗り exit 0。
      #
      # ⚠️ `retreat --verify` は**ここに配線しない。** 同じ env で撃つと
      #    `✗ 実機の settings.json が無い — 撤収の跡を検められない / exit 2` になる。
      #    それは正しい振る舞いである(神の住処の凍結は実機でしか照合できず、
      #    「測れなかった」を緑にしないのが第37条)。だが CI では必ず exit 2 なので
      #    配線すれば CI が常に赤い。**神の住処の照合は実機で走らせる門である。**
      - name: 🏠 Abode(撤収)— 実機の hooks が楽園を指していないか (AC-30 / 第20条の鏡像)
        run: node graph/abode.js check --backrefs

      # (EX-3 は 2026-09-18 に閉じた — graph/abode.json closed[CL-2]。apply-hooks.js は退役。)

      # ── 兄弟倉への配備 (第5段 / EX-2 / AC-46〜50) ──
      # CI には兄弟倉が無い。ゆえにここは **`· skip: creations abode 不在: …` を
      # 名乗って exit 0** になるのが正しい(AC-49)。**黙った緑ではない。**
      # 逆に兄弟倉が在るのに神官が居なければ exit 1 —— 不在は skip ではない(AC-48)。
      - name: 🏠 Abode(兄弟倉)— 環が起動する場所に神官が居るか (EX-2 / AC-46〜50)
        run: node graph/abode.js check --creations

      # ── 両居 (第2段 / 第58条(e)) ──
      # `<repo>/.claude/` は git 追跡の**派生物**である。clone 直後から在るので、
      # ここは skip に落ちてはならない —— 落ちたら「派生物の欠損」であり赤である。
      # **skip した門は門ではない**(第37条)。
      - name: 🏠 Abode(repo)— リポジトリ内の住処へ実際に配備できるか (AC-5/6/13)
        run: |
          PARADISE_ABODE=repo node graph/deploy.js plan
          PARADISE_ABODE=repo node graph/deploy.js check
          PARADISE_ABODE=repo node graph/apply-guards.js verify

      # ── 両居 (第2段 / 第58条(e)) ──
      # **段を二つに割った** (reform/gate-fold / requirements §8-2)。
      # 旧: 一つの段で repo と global を続けて撃っていた。だが
      #   (a) 段の秒数 841s の内訳 420s/421s は**按分であって直接測定ではなかった**
      #   (b) `=repo` は畳み `=global` は決して畳まない(AC-10)ので、
      #       一つの段に両方が居ると**畳みが効いたかを段の秒で読めない**(第38条)
      # 片方でしか緑にならないなら、それは両居ではない(第20条)—— その意味は変えていない。
      - name: 🏠 Abode(repo 自己診断)— リポジトリ内の住処で緑か (AC-53a)
        # 畳みの対象。Self-test 段と**同一入力**であることを鍵が保証する。
        # 鍵が一致しなければ `bail=key-miss` を名乗って全走する —— 畳めないことは赤ではない。
        env:
          PARADISE_FOLD_LEDGER: ${{ runner.temp }}/paradise-fold-ledger.jsonl
          # **台帳は checkout の外に住む**(security S-2 / BLOCK)。
          # `github.workspace` に置けば PR が `git add -f` で台帳そのものを持ち込め、
          # `.gitignore` は checkout を縛らない —— **データ 1 本で 4 段が偽の緑になる**。
          # 正しい形は畳みを見張る段が既に持っていた。四段をそれに揃える。
          # **一走行に閉じる**(security S-1 / requirements §7-6)。領収書の `run` 欄が
          # 走行を跨いだ再利用を拒む。**同じ job の段はすべて同じ値を名乗る** ——
          # でなければ畳みが一切効かない。`run_attempt` を含めるのは再実行が別の走行だからである。
          PARADISE_FOLD_RUN: gh-${{ github.run_id }}-${{ github.run_attempt }}
        run: PARADISE_ABODE=repo node tests/paradise.test.js

      - name: 🏠 Abode(global 自己診断)— 実機の住処で緑か (AC-53b)
        # **この段は決して畳まれない**(AC-10 / 揟2)。結果が `~/.claude` という
        # 宣言外の状態に依る(findings §1.3 の実測: 6 門 12 行が別の答えを出す)。
        # Bazel で言う `tags = ["external"]` である(findings §4.3)。
        # 台帳を**渡さない**のは飾りではない: 渡しても `bail=undeclared-state` で
        # 畳まれないが、**渡さないことで「畳める経路が物理的に無い」ことを段が名乗る**。
        run: PARADISE_ABODE=global node tests/paradise.test.js

      # ── ダッシュボードの門 G-01〜G-10 (第22条 / 第50条) ──
      # **門が見ていない機能は、壊れても鳴らない。**
      # 改修前、tribunal.yml 全 207 行のうちダッシュボードに触れるのは atlas の 1 行のみで、
      # dashboard/index.html は visual-verify も critic も一度も通っていなかった。
      - name: 🔢 Dashboard counts — 画面の数が嘘をつかないか (G-01 / 第22条)
        # 断面の数 == その場で数えた数。固定値とは比べない(則3)
        run: node tests/dashboard-count.test.js

      - name: 🚫 Dashboard deps — 外部依存が再び生えていないか (G-02 / NFR-02)
        run: node tests/dashboard-no-deps.test.js

      - name: 🔗 Dashboard links — 孤児ページが生まれていないか (G-04 / FR-19)
        run: node tests/dashboard-links.test.js

      - name: 🔒 Dashboard hardcode — 固定値が再発していないか (G-06 / FR-02)
        run: node tests/dashboard-no-hardcode.test.js

      - name: ⏱ Dashboard perf — 同期経路が遅く/子プロセス化していないか (G-07 + G-10)
        run: node tests/dashboard-perf.test.js

      - name: 🖥 Dashboard states — 5 状態と経路とスピナー禁止 (FR-20 / FR-07 / FR-08)
        run: |
          node tests/dashboard-transport.test.js
          node tests/dashboard-freshness.test.js
          node tests/dashboard-states.test.js

      - name: ⚖️ Dashboard run panel — 点数と起動実績の矛盾が見えるか (FR-13/14/22)
        # spawn-trace.report() にパスを渡すと例外を投げず {ok:true,total:0} を返す。
        # **引数の型を間違えると門が鳴ること**を、故障注入で確かめる(D-3)
        run: node tests/dashboard-run-panel.test.js

      - name: 📡 Dashboard SSE — 形式・ポート・接続数 (FR-09 / FR-10 / NFR-03)
        run: node tests/dashboard-sse.test.js

      - name: 👀 Dashboard watch — デバウンスと change/rename の等価 (FR-11 / NFR-04)
        run: node tests/dashboard-watch.test.js

      - name: 🎨 Dashboard surface — visual-verify と critic が画面を見る (G-05 / 第50条)
        # 第50条の直接の是正。dashboard/index.html と dashboard/control.html を門に載せる
        #
        # ⚠️ **`|| true` を付けるな**(quality 枢機卿が審査で指摘・教主が是正)。
        # 付けた瞬間、critic が何を言おうと CI は緑になる —— それは
        # 「門の形をした飾り」であり、第50条が名指しした『見ていない門』そのものである。
        # 実測(2026-09-02): `critic.js review dashboard --self` は exit=0 で
        # 5項目すべて緑。**通る門なのだから、通らせる必要が無い。**
        run: |
          node graph/visual-verify.js check dashboard --json
          node graph/critic.js review dashboard --self

      - name: 🧹 Motion probe leak — 門が己の残骸で不定に鳴らないか (G-09 / 第50条の裏面)
        # **症状(0 failed)ではなく原因(プロファイル数の差分)を裁く。**
        # 漏れが 529 個まで悪化した状態でも自己診断は 0 failed を出した。
        run: node tests/motion-probe-leak.test.js

      - name: 🧊 Dashboard fallback — file:// で凍結を正直に名乗るか (FR-08 / NFR-06)
        # Chrome の file:// からの fetch は network error になる。node では再現できない
        run: node tests/dashboard-fallback.test.js

      - name: 🕊 Vendor — 取り込んだ道具が上流へ電話をかけないか (第20条・第47条d)
        run: node graph/vendor.js verify

      - name: 🗝 Spawn authority — 下位を擁する者が起動の権能を持つか (第25条)
        run: node graph/apply-spawn.js verify

      - name: 👁 Spawn trace — 起動の証跡を裁く機構が働くか (第27条)
        run: |
          # 門をわざと壊して鳴るか確かめる。健全な系しか見ていない門は試されていない。
          node -e "
            const assert = require('assert');
            const fs = require('fs'), os = require('os'), path = require('path');
            const contract = require('./graph/contract.js');
            const trace = require('./graph/spawn-trace.js');
            const tmp = fs.mkdtempSync(path.join(os.tmpdir(), 'ci-'));
            const art = path.join(tmp, 'a.md');
            fs.writeFileSync(art, 'x'.repeat(80));
            const run = { domains: [{ phases: [{ id: 'p' }] }] };
            // 成果物は完璧に在るが、誰も起動されていない
            assert.strictEqual(contract.reconcile({phase:'p',status:'done',artifact:art},{run}).accepted, false,
              'an unspawned phase must be rejected');
            // 自己申告だけでも通してはならない
            trace.record(run, 'p', { agent: 'x' });
            assert.strictEqual(contract.reconcile({phase:'p',status:'done',artifact:art},{run}).accepted, false,
              'a bare claim is not evidence');
            // 観測された起動だけが通る
            trace.record(run, 'p', { agent: 'x', toolUseId: 'toolu_1' });
            assert.strictEqual(contract.reconcile({phase:'p',status:'done',artifact:art},{run}).accepted, true,
              'an observed dispatch is accepted');
            console.log('spawn trace gate fires correctly on all three states');
          "

      - name: 👁 Tier audit — 序列の門が実在の走行を見る (第42条 / 第52条)
        # 走査対象は実在する conclave.json（合成した run ではない）。
        # 合成 run しか見ない門は健全な系しか見ない — 故障注入の段(上)と対になる。
        # 既存の走行は紀元の印を持たないので黄に落ち、CI は落ちない。
        # 落ちるのは紀元以後の違反だけである。
        run: node graph/spawn-trace.js audit

      - name: 🎭 Domains — 役者は担える分野を宣言しているか (第52条)
        # 実在(check-agents)と適合(domains)は別の問いである。
        run: node graph/domains.js check

  tribunal:
    name: ⚖️ 執行官の裁定 (independent judgment)
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 執行官を召喚 — critic による敵対的自己批評
        id: critic
        # ⚠️ **`|| true` を外した** (reflect C-2 / 教主が rework2 で是正)。
        #
        # 実測(reflect, 2026-09-03): この段は `|| true` により
        #   正常73件→緑 / 壊れJSON 0件→緑 / 不在 0件→緑 / 空配列 0件→緑
        # **何を食わせても緑**だった。81行上(:181)に教主自身が
        # 「`|| true` を付けるな — 付けた瞬間 critic が何を言おうと CI は緑になる」
        # と書いた戒めが、この段で破られていた。
        #
        # ── 三段それぞれの扱い ────────────────────────────────
        # 1. `lessons.js export` … **`|| true` を外す。**
        #    CI に KG は無いので export は 0 件を書き、**版管理下の 72 件を消す**。
        #    engine 側で「0 件で非空を上書きするなら exit 1」を建てた(lessons.js)。
        #    ゆえにこの段は CI で必ず鳴る —— **鳴るのが正しい。**
        #    だから **CI では export を撃たない**。版管理下の lessons.json を
        #    そのまま使う。生成物の中身は前提にしない(第29条)が、
        #    「存在すること」は前提にしてよい —— 追跡下のファイルだからである。
        # 2. `critic review --lessons` … **`|| true` を外す。**
        #    critic は教訓 0 件/読めない帳を `INCONCLUSIVE` として exit 1 にする。
        #    「教訓を撃たずに何も見つからなかった」を緑にしない(第37条)。
        # 3. `workspace check` … 下の段で扱う。
        run: |
          echo "### 🔍 Reflect — 楽園エンジンの自己批評" > verdict.md
          echo '```' >> verdict.md
          # 版管理下の教訓帳で撃つ。CI で export し直せば 0 件になり、
          # 「教訓を撃たない断罪」になる —— それは門の形をした飾りである。
          test -s graph/lessons.json || { echo "::error::graph/lessons.json が無い/空 — 断罪の門が教訓を一つも撃てない"; exit 1; }
          node graph/critic.js review graph --self --lessons graph/lessons.json >> verdict.md 2>&1
          echo '```' >> verdict.md
          # 創造物はもはや楽園に住まない(第30条)。CI が検めるのは engine のみ。
          # 創造物の批評は paradise-creations 側で行う。
          echo "### 🏛️ Workspace — 創造物の分離 (第30条)" >> verdict.md
          echo '```' >> verdict.md
          # ⚠️ `|| true` を外した。`workspace.js check` は verify job の
          # 「🏛️ Workspace」段でも撃たれており、**そこで既に赤になる門である**。
          # ここで緑に潰せば、同じ門が二つの job で違う答えを出す(第27条: 環と器が割れる)。
          node graph/workspace.js check >> verdict.md 2>&1
          echo '```' >> verdict.md

      - name: 裁定を下す — SHIP / REWORK / BLOCK
        id: verdict
        run: |
          # Build the verdict report from REAL evidence gathered by the verify job.
          TESTS=$(node tests/paradise.test.js 2>&1 | tail -1)
          PASSED=$(echo "$TESTS" | grep -oE '[0-9]+ passed' | grep -oE '[0-9]+' || echo 0)
          FAILED=$(echo "$TESTS" | grep -oE '[0-9]+ failed' | grep -oE '[0-9]+' || echo 0)
          cat > verdict-report.json <<EOF
          {
            "produces": "engine",
            "build": "pass",
            "types": { "status": "pass" },
            "lint": { "status": "pass" },
            "tests": { "passed": $PASSED, "failed": $FAILED, "total": $((PASSED+FAILED)), "coverage": 100 },
            "security": { "issues": 0, "secrets": 0 },
            "spec": { "satisfied": true, "unmet": [] }
          }
          EOF
          echo "### ⚖️ VERDICT" >> verdict.md
          echo '```' >> verdict.md
          node graph/verdict.js judge verdict-report.json >> verdict.md 2>&1
          RC=$?
          echo '```' >> verdict.md
          echo "verdict_rc=$RC" >> "$GITHUB_OUTPUT"
          echo "" >> verdict.md
          echo "> 執行官はどの枢機卿にも従属しない。最終承認は神（リポジトリ所有者）が行う。" >> verdict.md
          exit $RC

      - name: 裁定をPRに掲示
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.existsSync('verdict.md')
              ? fs.readFileSync('verdict.md', 'utf8')
              : '⚖️ 執行官が裁定を出せませんでした。';
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

  # ── 発報 (第60条候補: 鳴らない門は門ではない) ──────────────────────────
  #
  # **実測された病**: PR #51 の検証ゲートが赤くなったが、教主も神も気づかなかった。
  # GitHub の既定の通知は神の目に届いていない —— **鳴っていない門と、鳴ったのに
  # 誰も聞かない門は、結果において同じである**(第37条の系)。
  #
  # ゆえに裁定そのものを神の場所(Discord #神籬)へ運ぶ。
  #   · 赤いときは必ず鳴る
  #   · 緑のときは PR のときだけ鳴る(main への push で毎回鳴れば、やがて無視される)
  #   · **webhook が未設定なら「鳴らせなかった」と CI の注記に残す** ——
  #     黙って成功したふりをしない。設定漏れは沈黙ではなく可視でなければならない。
  herald:
    name: 📣 発報 — 裁定を神へ運ぶ
    runs-on: ubuntu-latest
    needs: [verify, tribunal]
    if: always()
    steps:
      - name: 裁定を組み立てて送る
        env:
          HOOK: ${{ secrets.DISCORD_WEBHOOK }}
          VERIFY: ${{ needs.verify.result }}
          TRIBUNAL: ${{ needs.tribunal.result }}
        run: |
          set -u
          if [ "$VERIFY" = "success" ] && { [ "$TRIBUNAL" = "success" ] || [ "$TRIBUNAL" = "skipped" ]; }; then
            STATE="green"; ICON="✅"; WORD="緑"
          else
            STATE="red";   ICON="🔴"; WORD="赤"
          fi

          # 緑 かつ PR でないなら黙る(騒音は門を殺す)
          if [ "$STATE" = "green" ] && [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "::notice::緑かつ PR でないため発報しない"
            exit 0
          fi

          TITLE="${ICON} 楽園の門は${WORD} — ${{ github.repository }}"
          WHERE="${{ github.event_name }} / ${{ github.ref_name }}"
          PRNUM="${{ github.event.pull_request.number }}"
          [ -n "$PRNUM" ] && WHERE="PR #${PRNUM}"
          URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY="${TITLE}
          ${WHERE}
          検証ゲート: ${VERIFY} / 執行官: ${TRIBUNAL}
          ${URL}"

          if [ -z "${HOOK:-}" ]; then
            # **黙らない。** 発報できなかったこと自体を CI の注記に残す(第37条)。
            echo "::warning::DISCORD_WEBHOOK が未設定のため発報できなかった — 裁定は ${WORD}。設定するまで神は CI の赤に気づけない"
            echo "$BODY"
            exit 0
          fi

          printf '%s' "$BODY" | jq -Rs '{content: .}' > payload.json
          code=$(curl -s -o resp.txt -w '%{http_code}' -H 'Content-Type: application/json' \
                      -X POST -d @payload.json "$HOOK")
          echo "discord http=$code"
          # 送信の失敗を緑に混ぜない —— 発報の門もまた門である
          case "$code" in 2*) echo "::notice::発報した (${WORD})";; *) echo "::error::発報に失敗した http=$code"; cat resp.txt; exit 1;; esac
